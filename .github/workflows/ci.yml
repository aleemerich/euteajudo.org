name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci

      - name: Generated theme files match the design tokens
        run: npm run check:theme

      - name: JavaScript lint
        run: npm run lint

      - name: Start DDEV (PHP 8.5, MySQL 5.7, Apache) and install WordPress
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: true

      - name: Install PHP tooling
        run: ddev composer install --no-interaction --no-progress

      - name: PHPCS and PHPStan
        run: ddev composer lint

      - name: Unit and integration tests
        run: ddev composer test

      - name: End-to-end tests (phone and desktop)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
