; Same limits as the shared hosting (cPanel, ea-php85). See docs/adr/0004-ddev-and-hosting-parity.md
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
max_input_vars = 1000
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = America/Fortaleza
allow_url_fopen = On
; Local only: define WordPress debug constants without editing the DDEV-managed wp-config.php.
auto_prepend_file = /var/www/html/.ddev/scripts/wp-local-constants.php
